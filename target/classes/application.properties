app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=480
app.security.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.google.credentials-file=${GOOGLE_CLIENT_SECRET_FILE:../../client_secret_141274435555-o76eb7rt7kngh30q0ohs8ur4a1g0mg2d.apps.googleusercontent.com.json}
app.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/backend/auth/google/callback}
app.security.google.frontend-redirect-uri=${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:5173/}
# Primeiro ADMIN (criado so se ainda nao existir nenhum). Sem palavra-passe, e gerada e escrita no log.
