spring.application.name=proj
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=mabjaiaInn
spring.datasource.password=mbj2027
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Seguranca (JWT) ---
# Defina JWT_SECRET (minimo 32 caracteres) em producao. Sem ela, e gerada uma chave temporaria a cada arranque.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=480
# Primeiro ADMIN (criado so se ainda nao existir nenhum). Sem palavra-passe, e gerada e escrita no log.
app.security.bootstrap-admin.username=admin@mbj.inn
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Origens permitidas pelo CORS (separadas por virgula). Com o proxy do Vite nao e necessario.
app.cors.allowed-origins=http://localhost:5173

# --- Precos ---
# Valor de cada hora adicional numa estadia personalizada (igual ao usado ao prolongar uma reserva).
app.pricing.extra-hour-rate=500
