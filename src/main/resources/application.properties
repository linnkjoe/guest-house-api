spring.config.import=optional:file:./.env[.properties]
spring.application.name=proj
server.port=${PORT:8080}

# PostgreSQL (Render). Locally, use the same variables in .env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mabjaiainn}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Email verification (optional; configure credentials outside source control).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Security (secrets must be supplied through environment variables).
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=480
app.security.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.google.credentials-file=${GOOGLE_CLIENT_SECRET_FILE:}
app.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/backend/auth/google/callback}
app.security.google.frontend-redirect-uri=${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:5173/}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin@mbj.inn}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Pricing
app.pricing.extra-hour-rate=500
